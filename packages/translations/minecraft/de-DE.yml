# Minecraft Network Manager – plugin messages (de-DE)
prefix: "<dark_gray>[<aqua>Netzwerk</aqua>]</dark_gray> "

error.no-permission: "<red>Du hast keine Berechtigung für diesen Befehl."
error.player-not-found: "<red>Ein Spieler namens {player} wurde in diesem Netzwerk noch nicht gesehen."
error.invalid-duration: "<red>Ungültige Dauer \"{input}\". Beispiele: 30m, 12h, 7d, 1w."
error.backend-unavailable: "<red>Das Netzwerk-Backend ist derzeit nicht erreichbar. Bitte versuche es später erneut."
error.usage: "<red>Verwendung: {usage}"

punishment.ban.screen: "<red><bold>Du bist von diesem Netzwerk gebannt.</bold></red>\n\n<gray>Grund: <white>{reason}</white>\n<gray>Strafen-ID: <white>{id}</white>"
punishment.tempban.screen: "<red><bold>Du bist vorübergehend von diesem Netzwerk gebannt.</bold></red>\n\n<gray>Grund: <white>{reason}</white>\n<gray>Läuft ab: <white>{expires}</white> <dark_gray>(noch {remaining})</dark_gray>\n<gray>Strafen-ID: <white>{id}</white>"
punishment.kick.screen: "<red>Du wurdest vom Netzwerk gekickt.</red>\n\n<gray>Grund: <white>{reason}</white>"
punishment.mute.notice: "<red>Du bist stummgeschaltet. Grund: {reason}"
punishment.tempmute.notice: "<red>Du bist bis {expires} stummgeschaltet. Grund: {reason}"
punishment.warn.notice: "<gold>Du hast eine Verwarnung erhalten: <white>{reason}</white>"

command.ban.success: "<green>{player} wurde gebannt. ID: {id}"
command.tempban.success: "<green>{player} wurde für {duration} gebannt. ID: {id}"
command.unban.success: "<green>{player} wurde entbannt."
command.mute.success: "<green>{player} wurde stummgeschaltet. ID: {id}"
command.tempmute.success: "<green>{player} wurde für {duration} stummgeschaltet. ID: {id}"
command.unmute.success: "<green>Die Stummschaltung von {player} wurde aufgehoben."
command.kick.success: "<green>{player} wurde gekickt."
command.warn.success: "<green>{player} wurde verwarnt."
command.not-punished: "<yellow>{player} hat keine aktive Strafe dieses Typs."
command.history.header: "<gold>Strafhistorie von {player} ({count}):"
command.history.entry: "<gray>#{id} <white>{type}</white> – {reason} <dark_gray>({date}, von {issuer}, {status})"
command.history.empty: "<gray>{player} hat keine Strafhistorie."
command.check.header: "<gold>Status von {player}:"
command.check.banned: "<red>Gebannt</red> – {reason} (bis {expires})"
command.check.muted: "<red>Stummgeschaltet</red> – {reason} (bis {expires})"
command.check.clean: "<green>Keine aktiven Strafen."

notify.staff.punishment: "<gray>[Team] <white>{issuer}</white> hat <white>{player}</white> mit <white>{type}</white> bestraft: {reason}"
notify.staff.anticheat: "<gray>[AntiCheat] <white>{player}</white> wurde wegen <white>{cheat}</white> bestraft ({provider})"

time.permanent: "permanent"
time.never: "nie"

status.title: "<gold>Network-Manager-Status"
status.server: "<gray>Server: <white>{server}</white> <dark_gray>({type})"
status.connected: "<gray>Backend: <green>verbunden</green> <dark_gray>(letzter Kontakt {time})"
status.disconnected: "<gray>Backend: <red>nicht verbunden</red> <dark_gray>({error})"
status.unregistered: "<red>Dieser Server ist nicht registriert. Setze registration-token in config.properties und starte neu."
status.queue: "<gray>Ausstehende Ereignisse: <white>{pending}</white> <dark_gray>(verworfen: {dropped})"

error.already-banned: "<yellow>{player} ist bereits gebannt."
error.already-muted: "<yellow>{player} ist bereits stummgeschaltet."
error.player-offline: "<yellow>{player} ist nicht online."
error.request-failed: "<red>Die Anfrage ist fehlgeschlagen: {reason}"
error.not-synced: "<yellow>Strafdaten wurden noch nicht vom Backend geladen; der lokale Cache wird verwendet."

command.history.more: "<dark_gray>… und {count} weitere. Die vollständige Historie findest du im Dashboard."

type.ban: "Bann"
type.temp-ban: "Temporärer Bann"
type.mute: "Stummschaltung"
type.temp-mute: "Temporäre Stummschaltung"
type.kick: "Kick"
type.warning: "Verwarnung"
type.blacklist: "Blacklist"

state.active: "aktiv"
state.expired: "abgelaufen"
state.revoked: "aufgehoben"

anticheat.result: "<gray>AntiCheat-Meldung für <white>{player}</white> (<white>{cheat}</white>): <white>{outcome}</white>"

# Punishment editing (/editban, /editmute) and ban screen extras
punishment.appeal: "\n\n<gray>Einspruch: <white>{url}</white>"
punishment.mute.updated: "<yellow>Deine Stummschaltung wurde geändert. Grund: {reason} – bis {expires}"
command.edit.success: "<green>{type} {id} von {player} aktualisiert."
command.edit.duration: "<gray>Läuft ab: <white>{old}</white> → <white>{new}</white>"
command.edit.reason: "<gray>Grund: <white>{old}</white> → <white>{new}</white>"
error.no-changes: "<yellow>Nichts zu ändern: Die Strafe hat bereits diese Werte."
error.duration-elapsed: "<red>Diese Dauer ist seit der Erstellung der Strafe bereits abgelaufen. Verwende stattdessen /unban oder /unmute."
error.not-active: "<red>Diese Strafe ist nicht mehr aktiv. Reaktivieren ist nur im Dashboard möglich."
error.punishment-not-found: "<red>Es gibt keine Strafe mit der ID {input}."
error.permanent-permission: "<red>Du darfst Strafen nicht in permanente oder befristete umwandeln."
error.wrong-punishment-type: "<red>Strafe {input} ist nicht von dieser Art. Verwende /editban für Banns und /editmute für Stummschaltungen."
