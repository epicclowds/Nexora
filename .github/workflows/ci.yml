name: CI

# Source validation for every push and pull request. release.yml runs this
# workflow as its validation gate before anything is published. The Minecraft
# plugins are built and smoke-tested by build-plugins.yml.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # Superseded pull-request runs are cancelled; branch and release runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@12
      - run: npm ci
      - name: Versions are consistent across all components
        run: node infrastructure/scripts/check-versions.mjs
      - name: Build shared packages
        run: npm run build:packages
      - name: Validate translations
        run: npm run translations:validate
      - name: Validate Prisma schema
        run: npx prisma validate
        working-directory: apps/backend
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  backend-e2e:
    name: Backend e2e & migrations (MySQL 8.4 + Redis)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mnm
          MYSQL_USER: mnm
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: mysql://mnm:ci-password@127.0.0.1:3306/mnm
      E2E_DATABASE_URL: mysql://mnm:ci-password@127.0.0.1:3306/mnm
      E2E_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run build:packages
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
        working-directory: apps/backend
      - name: Check schema and migrations are in sync
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        working-directory: apps/backend
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend
      - name: End-to-end tests
        run: npx vitest run test/e2e.spec.ts
        working-directory: apps/backend

  dashboard:
    name: Dashboard production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run build:packages
      - run: npm run build -w @mnm/dashboard

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [quality]
    strategy:
      matrix:
        component: [backend, dashboard]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/${{ matrix.component }}.Dockerfile
          push: false
          tags: nexora-local/${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deployment:
    name: Deployment, plugins, load test & backup/restore (Docker Compose)
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 50
    env:
      # Build the images from this commit (development override).
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Create environment with generated secrets
        run: |
          sh infrastructure/scripts/generate-secrets.sh
          token="ci-setup-$(openssl rand -hex 16)"
          sed -i "s/^SETUP_TOKEN=.*/SETUP_TOKEN=$token/; s/^DASHBOARD_BIND=.*/DASHBOARD_BIND=127.0.0.1/" .env
          echo "SETUP_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verify a fresh installation (setup, registration, plugin traffic, 2000 players)
        run: node infrastructure/scripts/verify-deployment.mjs http://127.0.0.1:3000 setup
      - name: Real Velocity and Paper servers register with the stack
        # Each server phase has its own timeout in the script; this is the outer limit.
        timeout-minutes: 12
        run: |
          version=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          ./gradlew :velocity-plugin:jar :paper-plugin:jar --no-daemon
          node infrastructure/scripts/verify-deployment.mjs http://127.0.0.1:3000 plugin-tokens
          velocity=$(node -p 'require("./infrastructure/compatibility.json").integration.velocity')
          paper=$(node -p 'require("./infrastructure/compatibility.json").integration.paper')
          SMOKE_WORKDIR=$RUNNER_TEMP/smoke bash infrastructure/scripts/plugin-smoke-test.sh velocity "$velocity" "apps/velocity-plugin/build/libs/Nexora-Velocity-$version.jar" http://127.0.0.1:3000 "$(node -p 'require("./.smoke-tokens.json").velocity')"
          SMOKE_WORKDIR=$RUNNER_TEMP/smoke bash infrastructure/scripts/plugin-smoke-test.sh paper "$paper" "apps/paper-plugin/build/libs/Nexora-Paper-$version.jar" http://127.0.0.1:3000 "$(node -p 'require("./.smoke-tokens.json").paper')"
          node infrastructure/scripts/verify-deployment.mjs http://127.0.0.1:3000 plugins-registered "$version"
      - name: Load test (latency thresholds)
        run: node infrastructure/scripts/verify-deployment.mjs http://127.0.0.1:3000 load
        env:
          LOAD_SECONDS: '60'
          LOAD_P95_MS: '500'
      - name: Restart (migrations are idempotent, data persists)
        run: |
          docker compose restart backend dashboard
          docker compose up -d --wait --wait-timeout 180
          node infrastructure/scripts/verify-deployment.mjs http://127.0.0.1:3000 check
      - name: Back up the database
        run: sh infrastructure/scripts/backup.sh backups 14
      - name: Simulate data loss (remove all volumes)
        run: |
          docker compose down -v
          docker compose up -d --wait --wait-timeout 300
          curl -fsS http://127.0.0.1:3000/api/setup/status | grep -q '"initialized":false'
      - name: Restore and verify
        run: |
          sh infrastructure/scripts/restore.sh "$(ls backups/mnm-*.sql.gz | tail -n 1)" --yes
          docker compose up -d --wait --wait-timeout 180
          node infrastructure/scripts/verify-deployment.mjs http://127.0.0.1:3000 check
      - name: Container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail 300
      - name: Minecraft server logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-server-logs
          path: ${{ runner.temp }}/smoke/**/server.log
      - name: Remove test data
        if: ${{ always() }}
        run: |
          docker compose down -v || true
          rm -f .verify-state.json .smoke-tokens.json .env

  credentials:
    name: Database credentials (special characters, drift, repair)
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Environment with special-character passwords
        run: |
          sh infrastructure/scripts/generate-secrets.sh
          token="ci-setup-$(openssl rand -hex 16)"
          node .github/scripts/env-file.mjs set \
            'MYSQL_PASSWORD=Db@p:ss/w#rd%?&"1x' \
            'MYSQL_ROOT_PASSWORD=Ro#t:p@ss/w%rd&?"2y' \
            'REDIS_PASSWORD=R3d@s:p/ss#%?&"3z' \
            "SETUP_TOKEN=$token" 'DASHBOARD_BIND=127.0.0.1'
          echo "SETUP_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Fresh installation works with these passwords
        env:
          VERIFY_PLAYERS: '50'
        run: node infrastructure/scripts/verify-deployment.mjs http://127.0.0.1:3000 setup
      - name: Password drift is diagnosed and repaired without data loss
        timeout-minutes: 20
        run: bash .github/scripts/test-database-credentials.sh http://127.0.0.1:3000
      - name: Container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail 200
      - name: Remove test data
        if: ${{ always() }}
        run: |
          docker compose down -v || true
          sudo rm -rf backups
          rm -f .verify-state.json .env

  standalone:
    # docker-compose.yml alone (no repository files, no scripts) with the
    # published images, exactly as pasted into a Docker manager: fresh install,
    # adoption of a v1.1.0 installation, restart, redeploy under another stack
    # name, pinning, P1000 diagnosis and the built-in HTTPS profile.
    name: Standalone stack (published images, compose file only)
    runs-on: ubuntu-latest
    needs: [compose]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous release's docker-compose.yml
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Standalone deployment, existing installation and updates
        # Prints the container logs itself on failure, then removes its test volumes.
        run: bash .github/scripts/test-standalone.sh

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files with the example environment
        run: |
          sed 's/CHANGE_ME/ci-placeholder-value-0123456789abcdef/' .env.example > .env
          docker compose config --quiet
          docker compose --profile https config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          # Production must pull published images and never build locally.
          if docker compose config | grep -q '^ *build:'; then echo "docker-compose.yml must not build images" >&2; exit 1; fi
          docker compose config | grep -q 'image: ghcr.io/epicclowds/nexora/backend:'
          docker compose config | grep -q 'image: ghcr.io/epicclowds/nexora/dashboard:'

  security:
    name: Secret & dependency scanning
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g npm@12
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Gitleaks (full history)
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          set +e
          ./gitleaks git --redact --no-banner --report-format json --report-path gitleaks-report.json .
          code=$?
          set -e
          # Surface findings as annotations (rule, file, line only - never the secret).
          if [ -s gitleaks-report.json ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=Gitleaks \(.RuleID)::Possible secret (\(.RuleID)) in commit \(.Commit[0:7])"' gitleaks-report.json
          fi
          exit $code
