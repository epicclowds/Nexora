name: NetworkManager
version: '${version}'
main: dev.mnm.paper.NetworkManagerPaper
description: Connects this Paper server to the Network Manager platform
authors: [Network Manager contributors]
api-version: '26.1'
permissions:
  networkmanager.admin:
    description: Allows /networkmanager (connection status)
    default: op
  networkmanager.update.notify:
    description: Receives in-game Nexora update notifications (only with update-notifications=true on Paper)
    default: op
  networkmanager.update.check:
    description: Allows /networkmanager update (update information)
    default: op
  networkmanager.anticheat.command:
    description: Allows /anticheatban (meant for the console and AntiCheat plugins)
    default: false
