# ------------------------------------------------------------------
# Network Manager plugin configuration
# ------------------------------------------------------------------

# Address of the Network Manager dashboard (the API is served under /api).
# Example: https://admin.example.net  or  http://10.0.0.5:3000
backend-url=http://localhost:3000

# Single-use registration token from Dashboard -> Settings -> Minecraft Integration.
# It is exchanged for credentials (stored in credentials.properties) on the next start.
# After a successful registration this value is no longer used and can be removed.
registration-token=

# Language of plugin messages (files in the plugin jar: messages/<locale>.yml).
language=en-US

# Store player IP addresses with connection records (Velocity only).
# IP addresses are personal data; only dashboard users with players.view.ip can see them.
collect-ip-addresses=true

# How often the server reports its status (5-300 seconds).
heartbeat-interval-seconds=15

# How often the proxy sends its full list of connected players (15-3600 seconds, Velocity only).
sync-interval-seconds=60

# Events kept in memory while the backend is unreachable. When full, the oldest are dropped
# and a full sync repairs the session state once the backend is back.
max-queued-events=50000

# --- Moderation ------------------------------------------------------
# Enforce network punishments: bans/kicks on the proxy, mutes on Paper. The local
# punishment cache (punishments-cache.json) keeps working during backend outages.
punishments-enabled=true
# Register /ban, /tempban, /unban, /mute, /tempmute, /unmute, /kick, /warn, /history, /check
# (Velocity only; requires punishments-enabled).
moderation-commands=true

# --- Paper only: statistics -------------------------------------------
# Collect Minecraft statistics (movement, combat, blocks, general) for the dashboard.
statistics-enabled=true
# How often statistics are sent (60-3600 seconds). Collection is spread over several ticks.
statistics-interval-seconds=300
# Comma-separated categories to collect: movement, combat, blocks, general
statistics-categories=movement,combat,blocks,general
# Seconds without movement or interaction before a player counts as AFK (30-3600).
afk-timeout-seconds=300

# --- Paper only: AntiCheat integration -------------------------------
# Plugins allowed to report violations through the Java API (comma-separated plugin names,
# e.g. Grim,Vulcan). Empty = no plugin may use the API. /anticheatban needs the
# networkmanager.anticheat.command permission (console always has it).
anticheat-integrations=
# Reports accepted per integration and minute; excess reports are dropped and logged.
anticheat-max-reports-per-minute=120

# --- Paper only: inventories ------------------------------------------
# Send inventory / Ender Chest snapshots to the dashboard and accept edits made there.
inventory-sync=true
enderchest-sync=true
# Periodic snapshots of online players (30-3600 seconds); snapshots are also sent on join and quit.
inventory-sync-interval-seconds=300

# --- Central management ------------------------------------------------
# Let the dashboard (Settings -> Plugin settings) override language, plugin messages,
# statistics and inventory options. Changes apply within one heartbeat, no restart needed.
# Set to false to use only the values in this file.
managed-settings=true

debug=false
