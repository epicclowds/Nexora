# Nexora – production stack using the published images from GitHub Container Registry.
#   sh infrastructure/scripts/generate-secrets.sh   # creates .env with random secrets
#   docker compose pull
#   docker compose up -d
# Nothing is compiled locally. To build from source instead, see docker-compose.dev.yml.
# MySQL and Redis are only reachable on the internal network.
# The project name is kept from earlier releases so existing volumes (data) are reused.

name: minecraft-network-manager

x-restart: &restart
  restart: unless-stopped

services:
  mysql:
    <<: *restart
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mnm}
      MYSQL_USER: ${MYSQL_USER:-mnm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 60s

  redis:
    <<: *restart
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    <<: *restart
    # Pinned release; change NEXORA_VERSION in .env to update (docs/installation/updating.md).
    image: ${NEXORA_IMAGE_PREFIX:-ghcr.io/epicclowds/nexora}/backend:${NEXORA_VERSION:-1.0.2}
    environment:
      NODE_ENV: production
      PORT: 4000
      # Credentials are passed separately; the entrypoint builds percent-encoded
      # connection URLs from them, so passwords may contain special characters.
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-mnm}
      DATABASE_USER: ${MYSQL_USER:-mnm}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      GEOIP_CITY_DB: ${GEOIP_CITY_DB:-}
      GEOIP_ASN_DB: ${GEOIP_ASN_DB:-}
    volumes:
      - ./geoip:/geoip:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    # Node.js needs no Linux capabilities and must never gain privileges.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

  dashboard:
    <<: *restart
    image: ${NEXORA_IMAGE_PREFIX:-ghcr.io/epicclowds/nexora}/dashboard:${NEXORA_VERSION:-1.0.2}
    environment:
      BACKEND_INTERNAL_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${DASHBOARD_BIND:-0.0.0.0}:${DASHBOARD_PORT:-3000}:3000'
    networks: [internal]
    # Node.js needs no Linux capabilities and must never gain privileges.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s

  # Optional HTTPS front with automatic certificates: docker compose --profile https up -d
  caddy:
    <<: *restart
    profiles: [https]
    image: caddy:2.10-alpine
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    depends_on:
      dashboard:
        condition: service_healthy
    networks: [internal]

volumes:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
